<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Кое что">

    <title>Удостоверение личности</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="tabs">
        <div class="title-row">
            <button class="back-button" id="backButton" aria-label="Назад">‹</button>
            <div class="header-title">Убла бла</div>
        </div>

        <div class="tabs-row">
            <div class="tab-switch">
                <span class="tab-indicator"></span>
                <button class="tab active" data-page="0">Дбла</button>
                <button class="tab" data-page="1">бла</button>
            </div>
        </div>
    </header>

    <main class="pages">
        <!-- Первая вкладка -->
        <section class="page active">
            <div class="photo-page">
                <div class="photo-frame" id="photoFrame">
                    <img src="myphoto.png" alt="Фото" id="photo1">
                    <span class="photo-hint" id="photoHint">
                        Здесь будет твоё фото
                    </span>
                </div>

                <div class="photo-notes">
                    <div class="outlined-note qr-note">
                        <img
                            class="qr-badge"
                            src="qr.jpg"
                            alt=""
                            aria-hidden="true"
                        >
                        <span>Предьявить документ</span>
                    </div>

                    <div class="outlined-note">
                        <img
                            class="share-photo"
                            src="share.jpg"
                            alt=""
                            aria-hidden="true"
                        >
                        <span>Отправить документ</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Вторая вкладка -->
        <section class="page">
            <div class="text-page">
                <div class="text-list">
                    <article class="text-card">
                        <p class="gray-text">ФИО</p>
                        <div class="black-row">
                            <p class="black-text">лаьа</p>
                        </div>
                    </article>

                    <article class="text-card">
                        <p class="gray-text">шото шото</p>
                        <div class="black-row">
                            <p class="black-text">шото шото</p>
                        </div>
                    </article>

                    <article class="text-card">
                        <p class="gray-text">Дата рождения</p>
                        <div class="black-row">
                            <p class="black-text">шото шото</p>
                        </div>
                    </article>

                    <article class="text-card">
                        <p class="gray-text">шото шото</p>
                        <div class="black-row">
                            <p class="black-text">шото шото</p>
                        </div>
                    </article>

                    <article class="text-card">
                        <p class="gray-text">шото шото</p>
                        <div class="black-row">
                            <p class="black-text">шото шото</p>
                        </div>
                    </article>

                    <article class="text-card">
                        <p class="gray-text">шото шото</p>
                        <div class="black-row">
                            <p class="black-text">шото шото</p>
                        </div>
                    </article>
                </div>

                <div class="outlined-note bottom-note">
                    <img
                        class="share-photo"
                        src="share.jpg"
                        alt=""
                        aria-hidden="true"
                    >
                    <span>Отправить реквизиты</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
